<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adminto - Super Admin Operator Control Center</title>
  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(17, 24, 39, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --primary: #ec4899;
      --accent: #8b5cf6;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --status-active: #10b981;
      --status-inactive: #ef4444;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      background-image: 
        radial-gradient(at 10% 10%, rgba(236, 72, 153, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
    }

    h1, h2, h3, h4 { font-family: var(--font-heading); }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .app-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
    }

    .navbar-content {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
    }

    .brand-logo { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.3rem;
    }

    .search-input {
      width: 100%;
      padding: 0.65rem 1rem;
      background: rgba(17, 24, 39, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px; color: #fff; font-size: 0.9rem;
    }

    .pulse-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
    }
    .pulse-badge.active { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .pulse-badge.inactive { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .metrics-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 2rem;
    }
    .metric-card { padding: 1.35rem; display: flex; justify-content: space-between; align-items: center; }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .modal-content { width: 100%; max-width: 700px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }

    .data-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; text-align: left; }
    .data-table th, .data-table td { padding: 0.85rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff; border: none; padding: 0.65rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    let INITIAL_OPERATORS = [
      { id: "admin_1", username: "admin", email: "admin@adminto.com", password: "admin123", fullName: "Super Administrator", role: "superadmin", expiryDate: "2099-12-31", firebaseConfig: { apiKey: "AIzaSySuperAdminKey2026", projectId: "adminto-superadmin-main", authDomain: "adminto-superadmin.firebaseapp.com", storageBucket: "adminto-superadmin.appspot.com", appId: "1:109823746501:web:super123", orgId: "org_superadmin_all" } },
      { id: "op_101", username: "operator1", email: "operator1@adminto.com", password: "operator123", fullName: "Regional Operator North", role: "operator", expiryDate: "2026-12-31", firebaseConfig: { apiKey: "AIzaSyOperatorNorthKey", projectId: "adminto-north-region", authDomain: "adminto-north.firebaseapp.com", storageBucket: "adminto-north.appspot.com", appId: "1:109823746501:web:north123", orgId: "org_north" } },
      { id: "op_102", username: "expired_operator", email: "expired@adminto.com", password: "pass123", fullName: "Expired Operator Account", role: "operator", expiryDate: "2025-01-01", firebaseConfig: { apiKey: "AIzaSyExpiredKey", projectId: "adminto-expired-region", authDomain: "adminto-expired.firebaseapp.com", storageBucket: "adminto-expired.appspot.com", appId: "1:109823746501:web:expired123", orgId: "org_expired" } }
    ];

    function SuperAdminApp() {
      const [operators, setOperators] = React.useState(INITIAL_OPERATORS);
      const [search, setSearch] = React.useState('');
      const [editingFbOp, setEditingFbOp] = React.useState(null); // Selected op for Firebase edit modal

      // Firebase edit modal form state
      const [fbForm, setFbForm] = React.useState({
        apiKey: '', projectId: '', authDomain: '', storageBucket: '', appId: '', orgId: ''
      });
      const [rawSnippet, setRawSnippet] = React.useState('');
      
      const [newOp, setNewOp] = React.useState({
        username: '', password: '', fullName: '', role: 'operator', expiryDate: '2026-12-31',
        firebaseConfig: { apiKey: 'AIzaSyKey', projectId: 'adminto-op-custom', authDomain: 'custom.firebaseapp.com', storageBucket: 'custom.appspot.com', appId: '1:1234:web:custom', orgId: 'org_custom' }
      });

      const handleOpenFbModal = (op) => {
        setEditingFbOp(op);
        setFbForm({
          apiKey: op.firebaseConfig?.apiKey || '',
          projectId: op.firebaseConfig?.projectId || '',
          authDomain: op.firebaseConfig?.authDomain || '',
          storageBucket: op.firebaseConfig?.storageBucket || '',
          appId: op.firebaseConfig?.appId || '',
          orgId: op.firebaseConfig?.orgId || 'org_main'
        });
        setRawSnippet('');
      };

      const handleParseSnippet = () => {
        try {
          let raw = rawSnippet.trim();
          if (raw.includes('{')) {
            raw = raw.substring(raw.indexOf('{'), raw.lastIndexOf('}') + 1);
          }
          const cleanJson = raw
            .replace(/(['"])?([a-zA-Z0-9_]+)(['"])?:/g, '"$2":')
            .replace(/'/g, '"')
            .replace(/,\s*}/g, '}');

          const parsed = JSON.parse(cleanJson);
          setFbForm({
            apiKey: parsed.apiKey || fbForm.apiKey,
            projectId: parsed.projectId || fbForm.projectId,
            authDomain: parsed.authDomain || (parsed.projectId ? parsed.projectId + '.firebaseapp.com' : fbForm.authDomain),
            storageBucket: parsed.storageBucket || (parsed.projectId ? parsed.projectId + '.appspot.com' : fbForm.storageBucket),
            appId: parsed.appId || fbForm.appId,
            orgId: fbForm.orgId || 'org_main'
          });
          alert("Successfully parsed Firebase snippet!");
        } catch (e) {
          alert("Could not parse snippet. Please enter fields manually.");
        }
      };

      const handleSaveFirebaseConfig = (e) => {
        e.preventDefault();
        if (!fbForm.projectId || !fbForm.apiKey) {
          alert("Firebase Project ID and API Key are required!");
          return;
        }

        setOperators(operators.map(o => o.id === editingFbOp.id ? {
          ...o,
          firebaseConfig: { ...fbForm }
        } : o));

        alert("Full Firebase credentials saved to separate database for operator '" + editingFbOp.username + "'!");
        setEditingFbOp(null);
      };

      const handleAddOperator = (e) => {
        e.preventDefault();
        if (!newOp.username || !newOp.password) return;

        const opObj = {
          id: "op_" + Date.now(),
          username: newOp.username,
          email: newOp.username + "@adminto.com",
          password: newOp.password,
          fullName: newOp.fullName || newOp.username,
          role: newOp.role,
          expiryDate: newOp.expiryDate,
          firebaseConfig: { ...newOp.firebaseConfig }
        };

        setOperators([...operators, opObj]);
        alert("Operator account '" + newOp.username + "' created successfully!");
        setNewOp({ username: '', password: '', fullName: '', role: 'operator', expiryDate: '2026-12-31', firebaseConfig: { apiKey: 'AIzaSyKey', projectId: 'adminto-op-custom', authDomain: 'custom.firebaseapp.com', storageBucket: 'custom.appspot.com', appId: '1:1234:web:custom', orgId: 'org_custom' } });
      };

      const handleEditExpiry = (op) => {
        const newDate = prompt("Update Expiration Date (YYYY-MM-DD) for operator '" + op.username + "':", op.expiryDate || "2027-12-31");
        if (newDate && newDate.trim()) {
          setOperators(operators.map(o => o.id === op.id ? { ...o, expiryDate: newDate.trim() } : o));
        }
      };

      const handleResetPassword = (op) => {
        const newPass = prompt("Enter new password for operator '" + op.username + "':");
        if (newPass && newPass.trim()) {
          setOperators(operators.map(o => o.id === op.id ? { ...o, password: newPass.trim() } : o));
          alert("Password for operator '" + op.username + "' updated successfully!");
        }
      };

      const handleDeleteOperator = (id) => {
        if (confirm("Are you sure you want to delete this operator account?")) {
          setOperators(operators.filter(o => o.id !== id));
        }
      };

      const filteredOps = operators.filter(o => 
        o.username.toLowerCase().includes(search.toLowerCase()) || 
        o.fullName.toLowerCase().includes(search.toLowerCase())
      );

      const activeCount = operators.filter(o => {
        const todayStr = new Date().toISOString().split('T')[0];
        return o.expiryDate >= todayStr;
      }).length;

      return (
        <div>
          {/* Header */}
          <header className="app-header">
            <div className="navbar-content">
              <div className="brand-logo">
                <div className="brand-icon">⚙️</div>
                <div>
                  <h3 style={{ color: '#fff', fontSize: '1.25rem' }}>SUPER ADMIN CONTROL CENTER</h3>
                  <div style={{ fontSize: '0.7rem', color: '#ec4899', textTransform: 'uppercase', letterSpacing: '1px', fontWeight: 600 }}>Operator & Firebase Database Licensing Console</div>
                </div>
              </div>

              <div style={{ display: 'flex', gap: '1rem', alignItems: 'center' }}>
                <a href="standalone.html" style={{ textDecoration: 'none' }}>
                  <button className="btn-secondary" style={{ color: '#818cf8', border: '1px solid rgba(99,102,241,0.3)', display: 'flex', alignItems: 'center', gap: '6px' }}>
                    <span>💻 Switch to Device Monitoring Dashboard →</span>
                  </button>
                </a>
                <button className="btn-secondary" style={{ color: '#f87171' }} onClick={() => window.location.href = 'standalone.html'}>
                  🚪 Logout
                </button>
              </div>
            </div>
          </header>

          <main style={{ maxWidth: '1400px', margin: '2rem auto', padding: '0 1.5rem', display: 'flex', flexDirection: 'column', gap: '2rem' }}>
            {/* Metric Overview Cards */}
            <div className="metrics-grid">
              <div className="glass-panel metric-card">
                <div>
                  <p style={{ fontSize: '0.8rem', color: '#9ca3af' }}>TOTAL OPERATORS</p>
                  <h2 style={{ color: '#fff' }}>{operators.length}</h2>
                </div>
                <div style={{ fontSize: '2rem' }}>👥</div>
              </div>

              <div className="glass-panel metric-card">
                <div>
                  <p style={{ fontSize: '0.8rem', color: '#9ca3af' }}>ACTIVE LICENSES</p>
                  <h2 style={{ color: '#34d399' }}>{activeCount}</h2>
                </div>
                <div style={{ fontSize: '2rem' }}>⚡</div>
              </div>

              <div className="glass-panel metric-card">
                <div>
                  <p style={{ fontSize: '0.8rem', color: '#9ca3af' }}>EXPIRED LICENSES</p>
                  <h2 style={{ color: '#f87171' }}>{operators.length - activeCount}</h2>
                </div>
                <div style={{ fontSize: '2rem' }}>⚠️</div>
              </div>
            </div>

            {/* Create Operator Form */}
            <form onSubmit={handleAddOperator} className="glass-panel" style={{ padding: '1.5rem', display: 'flex', flexDirection: 'column', gap: '1.25rem' }}>
              <h3 style={{ color: '#ec4899', fontSize: '1.1rem' }}>+ Create New Operator & Assign Firebase Database Credentials</h3>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '1rem' }}>
                <div>
                  <label style={{ fontSize: '0.8rem', color: '#9ca3af', display: 'block', marginBottom: '4px' }}>Username *</label>
                  <input type="text" className="search-input" required value={newOp.username} onChange={e => setNewOp({...newOp, username: e.target.value})} placeholder="e.g. operator_south" />
                </div>
                <div>
                  <label style={{ fontSize: '0.8rem', color: '#9ca3af', display: 'block', marginBottom: '4px' }}>Password *</label>
                  <input type="password" className="search-input" required value={newOp.password} onChange={e => setNewOp({...newOp, password: e.target.value})} placeholder="••••••••" />
                </div>
                <div>
                  <label style={{ fontSize: '0.8rem', color: '#9ca3af', display: 'block', marginBottom: '4px' }}>Full Name / Region</label>
                  <input type="text" className="search-input" value={newOp.fullName} onChange={e => setNewOp({...newOp, fullName: e.target.value})} placeholder="Operator Name" />
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '1rem' }}>
                <div>
                  <label style={{ fontSize: '0.8rem', color: '#9ca3af', display: 'block', marginBottom: '4px' }}>Role</label>
                  <select className="search-input" style={{ background: '#111827' }} value={newOp.role} onChange={e => setNewOp({...newOp, role: e.target.value})}>
                    <option value="operator">Operator</option>
                    <option value="admin">Administrator</option>
                  </select>
                </div>

                <div>
                  <label style={{ fontSize: '0.8rem', color: '#f87171', fontWeight: 600, display: 'block', marginBottom: '4px' }}>📅 Account Expiration Cutoff Date *</label>
                  <input type="date" className="search-input" required value={newOp.expiryDate} onChange={e => setNewOp({...newOp, expiryDate: e.target.value})} />
                </div>

                <div>
                  <label style={{ fontSize: '0.8rem', color: '#9ca3af', display: 'block', marginBottom: '4px' }}>Firebase Project ID *</label>
                  <input type="text" className="search-input" required value={newOp.firebaseConfig.projectId} onChange={e => setNewOp({...newOp, firebaseConfig: {...newOp.firebaseConfig, projectId: e.target.value}})} placeholder="adminto-op-custom" />
                </div>
              </div>

              <button type="submit" className="btn-primary" style={{ alignSelf: 'flex-start', padding: '0.75rem 1.5rem' }}>
                Create Operator & Generate License
              </button>
            </form>

            {/* Operator Roster Table */}
            <div className="glass-panel" style={{ padding: '1.5rem' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem' }}>
                <h3 style={{ color: '#fff' }}>Operator Licensing & Firebase Roster</h3>
                <input 
                  type="text" 
                  className="search-input" 
                  style={{ maxWidth: '300px' }} 
                  placeholder="Filter by Username or Name..." 
                  value={search} 
                  onChange={e => setSearch(e.target.value)} 
                />
              </div>

              <table className="data-table">
                <thead>
                  <tr>
                    <th>Operator</th>
                    <th>Role</th>
                    <th>License Expiration Date</th>
                    <th>Assigned Firebase Project</th>
                    <th>License Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {filteredOps.map(op => {
                    const todayStr = new Date().toISOString().split('T')[0];
                    const expired = op.expiryDate && op.expiryDate < todayStr;
                    return (
                      <tr key={op.id}>
                        <td>
                          <div style={{ fontWeight: 600, color: '#fff' }}>{op.fullName || op.username}</div>
                          <div style={{ fontSize: '0.75rem', color: '#9ca3af' }}>
                            User: <code style={{ color: '#93c5fd' }}>{op.username}</code> • Pass: <code style={{ color: '#f472b6' }}>••••••••</code>
                          </div>
                        </td>
                        <td><span style={{ color: '#818cf8', fontWeight: 600 }}>{op.role}</span></td>
                        <td style={{ color: expired ? '#f87171' : '#34d399', fontWeight: 600 }}>{op.expiryDate}</td>
                        <td>
                          <div><code style={{ color: '#a7f3d0' }}>{op.firebaseConfig?.projectId || 'Default'}</code></div>
                          <div style={{ fontSize: '0.75rem', color: '#6b7280' }}>Key: {op.firebaseConfig?.apiKey ? '••••••••' : 'None'}</div>
                        </td>
                        <td>
                          <span className={`pulse-badge ${expired ? 'inactive' : 'active'}`}>
                            <span className="pulse-dot"></span>
                            {expired ? 'EXPIRED' : 'ACTIVE'}
                          </span>
                        </td>
                        <td>
                          <div style={{ display: 'flex', gap: '6px' }}>
                            <button 
                              className="btn-secondary" 
                              style={{ color: '#6366f1', border: '1px solid rgba(99,102,241,0.3)', padding: '4px 8px' }}
                              onClick={() => handleResetPassword(op)}
                              title="Edit / Reset Password"
                            >
                              🔑 Reset Pass
                            </button>
                            <button 
                              className="btn-secondary" 
                              style={{ color: '#34d399', border: '1px solid rgba(16,185,129,0.3)', padding: '4px 8px' }}
                              onClick={() => handleEditExpiry(op)}
                              title="Edit / Extend Expiration Date"
                            >
                              📅 Edit Expiry
                            </button>
                            <button 
                              className="btn-secondary" 
                              style={{ color: '#f97316', border: '1px solid rgba(249,115,22,0.3)', padding: '4px 8px' }}
                              onClick={() => handleOpenFbModal(op)}
                              title="Edit Complete Firebase Credentials (API Key, Auth Domain, App ID, etc.)"
                            >
                              🔥 Edit Firebase Credentials
                            </button>
                            {op.role !== 'superadmin' && (
                              <button className="btn-secondary" style={{ color: '#f87171', padding: '4px 8px' }} onClick={() => handleDeleteOperator(op.id)}>
                                Delete
                              </button>
                            )}
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </main>

          {/* Full Firebase Credentials Modal for Super Admin */}
          {editingFbOp && (
            <div className="modal-overlay">
              <div className="glass-panel modal-content" style={{ maxWidth: '650px' }}>
                <div style={{ padding: '1.25rem 1.5rem', borderBottom: '1px solid rgba(255,255,255,0.08)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <h3 style={{ color: '#fff' }}>🔥 Firebase Credentials for Operator: <span style={{ color: '#ec4899' }}>{editingFbOp.username}</span></h3>
                    <p style={{ fontSize: '0.85rem', color: '#9ca3af' }}>Configure complete Firebase Web SDK parameters stored in the separate admin database.</p>
                  </div>
                  <button onClick={() => setEditingFbOp(null)} style={{ background: 'none', border: 'none', color: '#9ca3af', fontSize: '1.5rem', cursor: 'pointer' }}>×</button>
                </div>

                <div style={{ padding: '1.5rem', overflowY: 'auto', flex: 1, display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                  {/* Paste Snippet Auto-Parser */}
                  <div className="glass-panel" style={{ padding: '1rem' }}>
                    <label style={{ fontSize: '0.8rem', color: '#fff', display: 'block', marginBottom: '4px' }}>
                      📋 Paste Raw Firebase JavaScript Snippet (Auto-Fill Form):
                    </label>
                    <textarea 
                      rows={3} 
                      className="search-input" 
                      style={{ width: '100%', fontFamily: 'monospace', fontSize: '0.75rem', padding: '0.5rem' }} 
                      placeholder={`const firebaseConfig = {\n  apiKey: "AIzaSy...",\n  authDomain: "app.firebaseapp.com",\n  projectId: "project-id"\n};`}
                      value={rawSnippet}
                      onChange={e => setRawSnippet(e.target.value)}
                    />
                    <button type="button" className="btn-secondary" onClick={handleParseSnippet} style={{ marginTop: '0.5rem', width: '100%', fontSize: '0.8rem' }}>
                      ⚡ Auto-Parse JS Snippet & Fill Fields
                    </button>
                  </div>

                  {/* Form for all 6 Firebase Fields */}
                  <form onSubmit={handleSaveFirebaseConfig} style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                      <div>
                        <label style={{ fontSize: '0.8rem', color: '#9ca3af', display: 'block', marginBottom: '4px' }}>Firebase Project ID *</label>
                        <input type="text" className="search-input" required value={fbForm.projectId} onChange={e => setFbForm({...fbForm, projectId: e.target.value})} placeholder="e.g. adminto-north-region" />
                      </div>
                      <div>
                        <label style={{ fontSize: '0.8rem', color: '#9ca3af', display: 'block', marginBottom: '4px' }}>Firebase Web API Key *</label>
                        <input type="text" className="search-input" required value={fbForm.apiKey} onChange={e => setFbForm({...fbForm, apiKey: e.target.value})} placeholder="AIzaSy..." />
                      </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                      <div>
                        <label style={{ fontSize: '0.8rem', color: '#9ca3af', display: 'block', marginBottom: '4px' }}>Auth Domain</label>
                        <input type="text" className="search-input" value={fbForm.authDomain} onChange={e => setFbForm({...fbForm, authDomain: e.target.value})} placeholder="project-id.firebaseapp.com" />
                      </div>
                      <div>
                        <label style={{ fontSize: '0.8rem', color: '#9ca3af', display: 'block', marginBottom: '4px' }}>Storage Bucket</label>
                        <input type="text" className="search-input" value={fbForm.storageBucket} onChange={e => setFbForm({...fbForm, storageBucket: e.target.value})} placeholder="project-id.appspot.com" />
                      </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                      <div>
                        <label style={{ fontSize: '0.8rem', color: '#9ca3af', display: 'block', marginBottom: '4px' }}>App ID (`appId`)</label>
                        <input type="text" className="search-input" value={fbForm.appId} onChange={e => setFbForm({...fbForm, appId: e.target.value})} placeholder="1:123456789:web:abcd123" />
                      </div>
                      <div>
                        <label style={{ fontSize: '0.8rem', color: '#9ca3af', display: 'block', marginBottom: '4px' }}>Organization ID Scope (`orgId`)</label>
                        <input type="text" className="search-input" value={fbForm.orgId} onChange={e => setFbForm({...fbForm, orgId: e.target.value})} placeholder="org_north" />
                      </div>
                    </div>

                    <button type="submit" className="btn-primary" style={{ marginTop: '0.5rem', width: '100%', padding: '0.75rem', justifyContent: 'center' }}>
                      Save Complete Firebase Credentials to Admin Database
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SuperAdminApp />);
  </script>
</body>
</html>
